name: ci
# This repository is public, so Actions minutes are free — the standing rule
# ("no Actions workflows in private repos") does not bind here.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo build --all-targets
      - run: cargo test --all-targets
      - run: cargo test --doc
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo fmt --check

  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[test]'
      - run: pytest -q

  vectors-match:
    # The two implementations must be held to one set of vectors. The Python
    # suite asserts this too, but only when the Rust tree is present; this
    # makes it a gate of its own so a drifting copy cannot slip through a
    # skipped test.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          for f in attestation.bin kds_vcek.der milan_ask.der milan_ark.der; do
            cmp "tests/fixtures/snp/$f" "python/omne_attest/vectors/$f" \
              && echo "ok  $f" \
              || { echo "DRIFT: $f differs between the Rust and Python copies"; exit 1; }
          done
