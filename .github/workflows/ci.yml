name: ci
# NOTE (2026-09-08): automatic triggers are off because GitHub Actions is
# currently blocked on this account by a billing issue — runs fail before they
# start, which would show a red X that says nothing about the code. The checks
# below are exactly what is run locally before every commit
# (cargo build / test / doc / clippy -D warnings / fmt --check) and they pass.
# Restore `push` and `pull_request` here the moment billing is sorted.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo build --all-targets
      - run: cargo test --all-targets
      - run: cargo test --doc
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo fmt --check
